services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
    volumes:
      - work:/data/work

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. jpexs.duckdns.org)}
    depends_on:
      - app

volumes:
  work: {}
  caddy_data: {}
  caddy_config: {}
