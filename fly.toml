# Fly.io 24/7 backend for jpexs-web (Node + FFDec).
# Launch: fly launch --no-deploy (reuse this file) ; fly volumes create work --size 1 ; fly deploy
# Needs 1 GB RAM: Java + FFDec will OOM on the 256 MB default.
app = "jpexs-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
